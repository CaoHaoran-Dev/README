<!DOCTYPE html>
<html lang="en" data-page="index.html" data-i18n-title="home.title">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home — Haoran Cao</title>
<link rel="stylesheet" href="assets/css/home.css">
</head>
<body>

<section class="hero">
  <div class="hero-inner">
    <div class="eyebrow" data-i18n="home.eyebrow"></div>
    <h1 data-i18n="home.h1"></h1>
    <p class="subhead" data-i18n="home.subhead"></p>
    <div class="hero-links">
      <a class="btn-primary" href="projects/" data-i18n="home.ctaProjects"></a>
      <a class="btn-secondary" href="https://github.com/CaoHaoran-Dev" target="_blank" rel="noopener" data-i18n="home.ctaGithub"></a>
    </div>
  </div>
</section>

<!-- Featured Projects -->
<section class="section" id="featured">
  <div class="section-title-wrap">
    <div class="section-inner">
      <div class="section-header">
        <h2 data-i18n="home.featured.h2"></h2>
      </div>
    </div>
  </div>
  
  <div class="bento-grid">
    <div class="bento-divider"></div>

    <!-- 1. RunProcess (全宽，海军蓝光效) -->
    <div class="bento-card span-2 force-navy">
      <div class="bento-inner span-2-inner">
        <div class="bento-content">
          <h3 data-i18n="project.runprocess.title"></h3>
          <p class="tagline" data-i18n="project.runprocess.tagline"></p>
          <div class="bento-links">
            <a class="btn-primary" href="projects/runprocess.html" data-i18n="project.runprocess.learn"></a>
            <a class="btn-secondary-dark" href="https://github.com/CaoHaoran-Dev/RunProcess/releases" data-i18n="project.runprocess.download"></a>
          </div>
        </div>
        <div class="bento-image">
          <img src="assets/images/RunProcessDemo-Dark.png" alt="RunProcess UI">
        </div>
      </div>
    </div>

    <!-- 2. ProcessSH (左列) -->
    <div class="bento-card force-light">
      <div class="bento-inner">
        <div class="bento-content">
          <h3 data-i18n="project.processSH.title"></h3>
          <p class="tagline" data-i18n="project.processSH.tagline"></p>
          <div class="bento-links">
            <a class="btn-primary" href="projects/processsh.html" data-i18n="project.processSH.learn"></a>
            <a class="btn-secondary" href="https://github.com/CaoHaoran-Dev/ProcessSH/releases" data-i18n="project.processSH.download"></a>
          </div>
        </div>
        <div class="bento-image">
          <img src="assets/images/ProcessSHDemo-Light.png" alt="ProcessSH UI">
        </div>
      </div>
    </div>

    <!-- 3. FuckLang (右列) -->
    <div class="bento-card force-light">
      <div class="bento-inner">
        <div class="bento-content">
          <h3 data-i18n="project.fucklang.title"></h3>
          <p class="tagline" data-i18n="project.fucklang.tagline"></p>
          <div class="bento-links">
            <a class="btn-primary" href="projects/fucklang.html" data-i18n="project.fucklang.learn"></a>
            <a class="btn-secondary" href="https://github.com/CaoHaoran-Dev/FuckLang" data-i18n="project.fucklang.repo"></a>
          </div>
        </div>
        <div class="bento-image">
          <img src="assets/images/FuckLangDemo-Dark.png" alt="FuckLang REPL">
        </div>
      </div>
    </div>

    <!-- 4. Swift Zip Manager (左列，半高) -->
    <div class="bento-card auto-theme short-card">
      <div class="bento-inner">
        <div class="bento-content">
          <h3 data-i18n="project.swiftZip.title"></h3>
          <p class="tagline" data-i18n="project.swiftZip.tagline"></p>
          <div class="bento-links">
            <a class="btn-primary" href="projects/swift-zip-manager.html" data-i18n="project.swiftZip.learn"></a>
            <a class="btn-secondary" href="https://github.com/CaoHaoran-Dev/Swift-Zip-Manager/releases" data-i18n="project.swiftZip.download"></a>
          </div>
        </div>
      </div>
    </div>

    <!-- 5. RemoteLinkKit (右列，半高) -->
    <div class="bento-card auto-theme short-card">
      <div class="bento-inner">
        <div class="bento-content">
          <h3 data-i18n="project.remotelinkkit.title"></h3>
          <p class="tagline" data-i18n="project.remotelinkkit.tagline"></p>
          <div class="bento-links">
            <a class="btn-primary" href="projects/remotelinkkit.html" data-i18n="project.remotelinkkit.learn"></a>
            <a class="btn-secondary" href="https://github.com/CaoHaoran-Dev/RemoteLinkKit" data-i18n="project.remotelinkkit.repo"></a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Stack -->

  </div>

    <div class="bento-divider"></div>

    <!-- Languages (全宽) -->

      <div class="bento-inner span-2-inner">
        <div class="bento-content">
          <h3 data-i18n="home.stack.languages"></h3>
        </div>
        <div class="stack-grid" style="justify-content: center;">
          <span class="stack-pill">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/swift/swift-original.svg" alt="Swift">Swift
          </span>

            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/csharp/csharp-original.svg" alt="C#">C#
          </span>
          <span class="stack-pill">
            <!-- 换成了带字母的浅蓝色版本 -->

          </span>
          <span class="stack-pill">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/javascript/javascript-original.svg" alt="JavaScript">JavaScript
          </span>
          <span class="stack-pill">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/html5/html5-original.svg" alt="HTML">HTML

          <span class="stack-pill">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/css3/css3-original.svg" alt="CSS">CSS
          </span>
        </div>
      </div>
    </div>

    <!-- Frameworks (左列) -->
    <div class="bento-card auto-theme short-card">
      <div class="bento-inner">
        <div class="bento-content">
          <h3 data-i18n="home.stack.frameworks"></h3>
        </div>
        <div class="stack-grid" style="justify-content: center;">
          <span class="stack-pill">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/swift/swift-original.svg" alt="SwiftUI">SwiftUI
          </span>
          <span class="stack-pill">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/apple/apple-original.svg" alt="AppKit">AppKit
          </span>
          <span class="stack-pill">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/apple/apple-original.svg" alt="CryptoKit">CryptoKit
          </span>
          <!-- 微软官方 .NET 图标 -->
          <span class="stack-pill">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/dotnetcore/dotnetcore-original.svg" alt=".NET">.NET
          </span>
          <span class="stack-pill">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/windows11/windows11-original.svg" alt="WinUI 3">WinUI 3

    <!-- Tools (右列) -->
    <div class="bento-card auto-theme short-card">
      <div class="bento-inner">
        <div class="bento-content">
          <h3 data-i18n="home.stack.platforms"></h3>
        </div>
        <div class="stack-grid" style="justify-content: center;">
          <span class="stack-pill">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/apple/apple-original.svg" alt="macOS">macOS
          </span>
          <span class="stack-pill">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/windows11/windows11-original.svg" alt="Windows">Windows
          </span>
          <span class="stack-pill">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/xcode/xcode-original.svg" alt="Xcode">Xcode
          </span>
          <span class="stack-pill">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/vscode/vscode-original.svg" alt="VS Code">VS Code
          </span>
          <span class="stack-pill">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/git/git-original.svg" alt="Git">Git
          </span>
          <span class="stack-pill">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/homebrew/homebrew-original.svg" alt="Homebrew">Homebrew
          </span>
        </div>
      </div>
    </div>
</section>

  <div class="section-inner">
    <h2 data-i18n="home.about.h2"></h2>
    <p data-i18n="home.about.p1"></p>
    <a class="btn-primary" href="about/" data-i18n="home.about.more"></a>
  </div>
